services:
  strata:
    build:
      context: .
    image: strata
    container_name: strata

    gpus: all

    ports:
      - "${PORT:-8080}:8080"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    volumes:
      - ./data:/data

    environment:
      MODEL: "${MODEL:-IQ2_XS}"
      FAMILY: "${FAMILY:-qwen}"
      CONTEXT: "${CONTEXT:-32768}"
      VISION: "${VISION:-no}"
      KV: "${KV:-int8}"
      API_KEY: "${API_KEY:-}"
      REINSTALL: "${REINSTALL:-0}"
      LOW_RAM: "${LOW_RAM:-off}"

    restart: unless-stopped
